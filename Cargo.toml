[workspace]
resolver = "2"
members = [
    "crates/tz-player",
    "crates/tz-core",
    "crates/tz-playback",
    "crates/tz-analysis",
    "crates/tz-control",
    "crates/tz-db",
    "crates/tz-tui",
    "crates/tz-bench",
]
default-members = ["crates/tz-player"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Matthew Craig <15974146+taggedzi@users.noreply.github.com>"]
repository = "https://github.com/taggedzi/tz-player"
rust-version = "1.89"

[workspace.dependencies]
tz-core = { path = "crates/tz-core" }
tz-playback = { path = "crates/tz-playback" }
tz-analysis = { path = "crates/tz-analysis" }
# re-export path already exists
tz-control = { path = "crates/tz-control" }
tz-db = { path = "crates/tz-db" }
tz-tui = { path = "crates/tz-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
lofty = "0.25"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
rand = "0.9"
libloading = "0.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all", "symphonia-simd", "tracing"] }
hound = "3.5"
sha1 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
