[package]
name = "tz-audio-decoder"
description = "Bundled FFmpeg audio decoder process"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tz-audio-decoder"
path = "src/main.rs"

[dependencies]
tz-audio = { path = "../tz-audio", default-features = false }
serde_json.workspace = true
ffmpeg-sys-next = { version = "8.1.0", optional = true, default-features = false }
ffmpeg-next = { version = "8.1.0", optional = true, default-features = false, features = ["codec", "format", "software-resampling"] }

[features]
default = []
ffmpeg-native = ["dep:ffmpeg-sys-next", "dep:ffmpeg-next"]
