[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Lofty 0.25.0 still requires paste 1.0.15; owner Matthew Craig; expires 2026-11-08; see docs/SECURITY.md" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "deny"
# Test-only crates are not shipped. Build dependencies remain in scope because
# they can influence code in the release artifact.
include-dev = false
include-build = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    # MPL-2.0 is intentionally allowed for option-ext and Symphonia. Binary
    # releases must include THIRD_PARTY_LICENSES.html and its source links.
    "MPL-2.0",
    "Unicode-3.0",
    # The reviewed ffmpeg-next and ffmpeg-sys-next 8.1.0 crates declare WTFPL.
    # Their license text is reproduced in THIRD_PARTY_LICENSES.html.
    "WTFPL",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
